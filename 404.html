<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>ŞAHİ SİHA</title><link rel="icon" href="/logo.png">
<style>:root{--bg:#f3f5f7;--fg:#14202b;--muted:#5d6b78;--accent:#0b6e8a}
@media (prefers-color-scheme: dark){:root{--bg:#0b1118;--fg:#e4eaf0;--muted:#8d9aa7;--accent:#3cc4e6;color-scheme:dark}}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;
min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;text-align:center}
img{width:64px;height:64px;border-radius:50%}a{color:var(--accent);font-weight:600}p{color:var(--muted)}</style></head>
<body><main><img src="/logo.png" alt=""><h1>Sayfa bulunamadı</h1><p>Aradığınız adres yok.</p><p><a href="/">Giriş sayfasına dön</a></p></main></body></html>
